spring.application.name=barberbook-backend

# Database: set DB_PASSWORD as an environment variable (see README)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barberbook_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server — Render injects PORT
server.port=${PORT:8080}
# Behind Render's proxy: use X-Forwarded-* so the audit trail records the caller's real IP
# instead of the proxy's. Only safe because all traffic reaches the app through that proxy.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# JWT (RS256) — locally the dev key pair under src/main/resources/keys (gitignored, never commit).
# In the cloud, mount the keys as files and point these vars at them (e.g. file:/etc/secrets/private_key.pem).
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:classpath:keys/private_key.pem}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:classpath:keys/public_key.pem}
jwt.expiration-minutes=60

# Google OAuth2 (HU-02) — no credentials yet; login/google stays disabled until this is set
google.client-id=${GOOGLE_CLIENT_ID:}

# Initial admin — created only if both are set and the email doesn't exist yet
app.seed.admin.email=${SEED_ADMIN_EMAIL:}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}
app.seed.admin.name=${SEED_ADMIN_NAME:Administrador}

# Business rules (HU-12): local time zone, shop closing time (a service must end by then),
# slot grid step and minimum notice for same-day bookings.
app.business.zone=${BUSINESS_ZONE:America/Bogota}
app.business.close-time=${BUSINESS_CLOSE_TIME:19:00}
app.business.address=${BUSINESS_ADDRESS:Dirección del local por definir}
app.availability.slot-step-minutes=15
app.availability.min-advance-minutes=30

# Home screen (HU-06): bookings a client needs before "Recomendado para ti" appears
app.home.recommendation-min-bookings=${RECOMMENDATION_MIN_BOOKINGS:10}

# CORS — frontend dev server origin(s), comma-separated.
# 8443 is this project's actual Vite port (see frontend/vite.config.ts,
# inherited from Figma Make); 5173 is Vite's normal default, kept as a
# fallback in case someone runs a plain Vite setup instead.
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:8443,http://localhost:5173}
