spring.application.name=barberbook-backend

# Database (see .vscode/launch.json for local DB_PASSWORD, or set it as an env var yourself)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barberbook_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (RS256) — dev key pair under src/main/resources/keys, regenerate with openssl, never commit
jwt.private-key-path=classpath:keys/private_key.pem
jwt.public-key-path=classpath:keys/public_key.pem
jwt.expiration-minutes=60

# Google OAuth2 (HU-02) — no credentials yet; login/google stays disabled until this is set
google.client-id=${GOOGLE_CLIENT_ID:}

# CORS — frontend dev server origin(s), comma-separated.
# 8443 is this project's actual Vite port (see frontend/vite.config.ts,
# inherited from Figma Make); 5173 is Vite's normal default, kept as a
# fallback in case someone runs a plain Vite setup instead.
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:8443,http://localhost:5173}
